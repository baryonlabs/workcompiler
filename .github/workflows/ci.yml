name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: OPENWORKCOMPILER_TELEMETRY=off python -m pytest -q
      - run: OPENWORKCOMPILER_TELEMETRY=off owc skills install --agent claude && OPENWORKCOMPILER_TELEMETRY=off owc skills doctor --check
      - run: OPENWORKCOMPILER_TELEMETRY=off owc agent list
      - run: OPENWORKCOMPILER_TELEMETRY=off python -m core.openworklang compile examples/quality_analysis.work --build-dir /tmp/ci-build
      - run: OPENWORKCOMPILER_TELEMETRY=off python -m core.build from-trace examples/demo/customer-renewal-bench/output/proxy-trace-*.json --target ci-renewal --build-dir /tmp/ci-build --behaviors examples/customer-renewal
