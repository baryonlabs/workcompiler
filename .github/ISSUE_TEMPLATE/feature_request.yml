name: Feature request
description: Propose a change to the compiler, executor tiers, front agent, skills or docs
labels: [enhancement]
body:
  - type: textarea
    attributes: {label: Problem, description: What work cannot be compiled / measured / run today?}
    validations: {required: true}
  - type: textarea
    attributes: {label: Proposal}
  - type: textarea
    attributes: {label: Alternatives considered}
