[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openworkcompiler"
version = "0.2.0"
description = "Execution kernel that compiles proven AI work into durable workflows."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["adapters*", "core*", "protocols*"]
